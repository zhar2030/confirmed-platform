kind = "web"
previewPath = "/"
title = "CONFIRMED - منصة إدارة الصالونات"
version = "1.0.0"
id = "artifacts/salon-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22133

[services.development]
run = "pnpm --filter @workspace/salon-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/salon-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/salon-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22133"
BASE_PATH = "/"
