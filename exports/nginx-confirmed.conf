server {
    listen 80;
    server_name confirmedgrowth.com www.confirmedgrowth.com;

    # إعادة توجيه HTTP إلى HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name confirmedgrowth.com www.confirmedgrowth.com;

    # شهادة SSL (إذا تستخدمين Certbot)
    ssl_certificate     /etc/letsencrypt/live/confirmedgrowth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/confirmedgrowth.com/privkey.pem;

    # ── توجيه طلبات API لسيرفر Node.js ──────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── ملفات الواجهة الثابتة ────────────────────────────
    root /var/www/confirmed/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ضغط الملفات لسرعة أفضل
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
